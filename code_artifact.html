    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Nunito', 'sans-serif'],
                        hand: ['Caveat', 'cursive'],
                    },
                    colors: {
                        cream: '#FFF9F5',
                        blush: '#FFE8EE',
                        roseSoft: '#FFCCD8',
                        roseAccent: '#FF6B95',
                        roseDark: '#D9436B',

                        tgIncoming: '#182533',
                        tgOutgoing: '#2B5278',
                        tgReply: '#243447',
                    },
                    boxShadow: {
                        'scrapbook': '0 15px 35px -5px rgba(217, 67, 107, 0.14), 0 8px 15px -6px rgba(217, 67, 107, 0.08)',
                        'polaroid': '0 10px 25px -5px rgba(0, 0, 0, 0.08), 0 4px 10px -2px rgba(0, 0, 0, 0.04)',
                    }
                }
            }
        }

    <style>
        body {
            background-color: #FFF9F5;
            background-image: 
                radial-gradient(#FFD6E0 1.2px, transparent 1.2px),
                radial-gradient(#FFE8EE 1.2px, #FFF9F5 1.2px);
            background-size: 36px 36px;
            background-position: 0 0, 18px 18px;
            overflow-x: hidden;
        }

        /* Декоративный скотч на карточках альбома */
        .washi-tape {
            position: absolute;
            top: -12px;
            left: 50%;
            transform: translateX(-50%) rotate(-2deg);
            width: 110px;
            height: 26px;
            background: rgba(255, 182, 203, 0.65);
            backdrop-filter: blur(2px);
            border-left: 2px dashed rgba(255, 255, 255, 0.6);
            border-right: 2px dashed rgba(255, 255, 255, 0.6);
            box-shadow: 0 2px 6px rgba(217, 67, 107, 0.1);
            z-index: 10;
        }

        /* Анимация плавного появления страницы */
        @keyframes pageFadeIn {
            0% {
                opacity: 0;
                transform: translateY(14px) scale(0.98);
            }
            100% {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .page-animate {
            animation: pageFadeIn 0.45s cubic-bezier(0.22, 1, 0.36, 1) forwards;
        }

        /* Фоновые парящие сердечки */
        @keyframes floatUp {
            0% {
                transform: translateY(100vh) rotate(0deg) scale(0.8);
                opacity: 0;
            }
            15% {
                opacity: 0.45;
            }
            85% {
                opacity: 0.45;
            }
            100% {
                transform: translateY(-15vh) rotate(360deg) scale(1.1);
                opacity: 0;
            }
        }

        .bg-heart {
            position: fixed;
            bottom: -40px;
            pointer-events: none;
            z-index: 0;
            animation: floatUp linear infinite;
        }

        /* Анимация взрыва сердечек по клику */
        @keyframes burstHeart {
            0% {
                transform: translate(-50%, -50%) scale(0.4);
                opacity: 1;
            }
            100% {
                transform: translate(var(--tx), var(--ty)) scale(1.3) rotate(var(--rot));
                opacity: 0;
            }
        }

        .burst-particle {
            position: fixed;
            pointer-events: none;
            z-index: 9999;
            font-size: 22px;
            animation: burstHeart 1.1s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        /* Стилизация скроллбара */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #FFF9F5;
        }
        ::-webkit-scrollbar-thumb {
            background: #FFB6C9;
            border-radius: 9999px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #FF6B95;
        }
    </style>
</head>

        // Генерация фоновых плавающих сердечек
        function initFloatingHearts() {
            const container = document.getElementById('floating-hearts-bg');
            const icons = ['💗', '💖', '💕', '🌸', '✨', '💓'];
            for (let i = 0; i < 16; i++) {
                const el = document.createElement('div');
                el.className = 'bg-heart';
                el.textContent = icons[i % icons.length];
                el.style.left = Math.random() * 96 + 'vw';
                el.style.fontSize = (14 + Math.random() * 14) + 'px';
                el.style.animationDuration = (12 + Math.random() * 14) + 's';
                el.style.animationDelay = (-Math.random() * 20) + 's';
                container.appendChild(el);
            }
        }

        // Эффект салюта из сердечек по нажатию
        function spawnHeartBurst(event) {
            const hearts = ['💖', '💘', '💋', '❤️', '🥰', '💕'];
            const x = event ? event.clientX : window.innerWidth / 2;
            const y = event ? event.clientY : window.innerHeight / 2;

            for (let i = 0; i < 14; i++) {
                const particle = document.createElement('div');
                particle.className = 'burst-particle';
                particle.textContent = hearts[Math.floor(Math.random() * hearts.length)];
                particle.style.left = x + 'px';
                particle.style.top = y + 'px';

                const angle = (Math.PI * 2 * i) / 14 + (Math.random() - 0.5) * 0.4;
                const dist = 60 + Math.random() * 110;
                const tx = Math.cos(angle) * dist + 'px';
                const ty = (Math.sin(angle) * dist - 40) + 'px';
                const rot = (Math.random() - 0.5) * 90 + 'deg';

                particle.style.setProperty('--tx', tx);
                particle.style.setProperty('--ty', ty);
                particle.style.setProperty('--rot', rot);

                document.body.appendChild(particle);
                setTimeout(() => particle.remove(), 1150);
            }
        }

                        const bubbleColor = isMe ? 'bg-[#2B5278] text-white rounded-2xl rounded-br-sm' : 'bg-[#182533] text-slate-100 rounded-2xl rounded-bl-sm';
                        
                        const replyHtml = msg.replyTo ? `
                            <div class="mb-1.5 pl-2.5 py-1 pr-2 rounded-lg bg-black/25 border-l-2 ${msg.replyTo.color} text-xs">
                                <div class="font-bold leading-tight">${msg.replyTo.name}</div>
                                <div class="text-slate-300 truncate">${msg.replyTo.text}</div>
                            </div>
                        ` : '';

                        const reactionHtml = msg.reaction ? `
                            <div class="mt-1 inline-flex items-center gap-1 bg-[#2B5278]/90 px-2 py-0.5 rounded-full text-xs border border-blue-400/30">
                                <span>${msg.reaction}</span>
                                <span class="w-3.5 h-3.5 rounded-full bg-rose-400 text-[9px] flex items-center justify-center text-white font-bold">Я</span>
                            </div>
                        ` : '';

                        return `
                            <div class="flex ${alignClass}">
                                <div class="${bubbleColor} px-3.5 py-2 max-w-[85%] sm:max-w-[78%] shadow-sm text-sm sm:text-[15px] leading-snug">
                                    ${replyHtml}
                                    <div class="flex flex-wrap items-end gap-x-2 gap-y-0.5">
                                        <span class="break-words">${msg.text}</span>
                                        <span class="text-[10px] ${isMe ? 'text-blue-200/70' : 'text-slate-400'} ml-auto shrink-0 select-none">
                                            ${msg.time} ${isMe ? '✓✓' : ''}
                                        </span>
                                    </div>
                                    ${reactionHtml}
                                </div>
                            </div>
                        `;
                    }).join('')}
                </div>
            `;
        }

            if (page.isFinal) {

                    <article class="page-animate relative bg-gradient-to-br from-white via-rose-50/90 to-pink-100/70 rounded-3xl p-6 sm:p-10 shadow-scrapbook border-2 border-rose-200/80 text-center">

                        <div class="bg-white/90 backdrop-blur-sm rounded-2xl p-5 sm:p-8 border border-rose-200 shadow-sm relative mx-auto max-w-xl">
                            <span class="absolute -top-3 -left-2 text-2xl rotate-[-12deg]">🌸</span>
                            <span class="absolute -bottom-3 -right-2 text-2xl rotate-[12deg]">💖</span>

                            <p class="font-hand text-2xl sm:text-4xl font-bold text-rose-600 leading-relaxed mb-4">
                                «я очень сина тебя люблю моя бусинка, спасибо тебе за все время сколько ты была со мной»
                            </p>

                            <div class="w-16 h-1 bg-rose-200 rounded-full mx-auto my-4"></div>

                            <p class="text-sm sm:text-base text-slate-600 leading-relaxed font-medium">
                                Это только самые первые странички нашего большого альбома. Впереди у нас ещё миллион таких тёплых «утречек», смешных переписок, долгих звонков, дурацких шуток и самых счастливых моментов вместе. Спасибо, что ты есть у меня — моё самое главное чудо! 🥰
                            </p>
                        </div>

                        <div class="mt-7 flex flex-col sm:flex-row items-center justify-center gap-3">
                            <button onclick="spawnHeartBurst(event)" class="w-full sm:w-auto px-7 py-3.5 rounded-2xl bg-gradient-to-r from-rose-500 to-pink-500 hover:from-rose-600 hover:to-pink-600 text-white font-bold text-base shadow-lg hover:shadow-xl transition-all active:scale-95 flex items-center justify-center gap-2 cursor-pointer">
                                <span>Обнять и зацеловать</span>
                                <span>💘</span>
                            </button>
                            <button onclick="goToPage(0)" class="w-full sm:w-auto px-5 py-3.5 rounded-2xl bg-white hover:bg-rose-50 text-rose-500 font-bold text-sm border border-rose-200 transition-all active:scale-95 cursor-pointer">
                                Перечитать сначала ↺
                            </button>
                        </div>
                    </article>
                `;
            }

            return `
                <article class="page-animate relative bg-white rounded-3xl p-5 sm:p-8 shadow-scrapbook border border-rose-100">
                    <div class="washi-tape"></div>

                    <!-- Шапка карточки -->
                    <div class="flex items-start justify-between gap-3 mb-4 pt-1">
                        <div>
                            <div class="inline-flex items-center gap-1.5 text-xs font-extrabold text-rose-500 bg-rose-50 px-3 py-1 rounded-full border border-rose-100 mb-2">
                                <span>${page.badge}</span>
                                <span>•</span>
                                <span class="text-rose-400">${page.dateTag}</span>
                            </div>
                            <h2 class="font-hand text-2xl sm:text-4xl font-bold text-slate-800 leading-tight">
                                ${page.title}
                            </h2>
                        </div>
                        <div class="w-12 h-12 sm:w-14 sm:h-14 rounded-2xl bg-rose-50 border border-rose-100 flex items-center justify-center text-2xl sm:text-3xl shrink-0 shadow-sm rotate-3">
                            ${page.sticker}
                        </div>
                    </div>

                    <!-- Скрин-переписка -->
                    ${renderChatMessages(page.messages)}

                    <!-- Тёплая заметка под воспоминанием -->
                    <div class="mt-5 bg-cream rounded-2xl p-4 border border-rose-100/80 flex items-start gap-3">
                        <span class="text-xl mt-0.5 shrink-0">✍️</span>
                        <p class="text-sm sm:text-[15px] text-slate-600 leading-relaxed font-medium">
                            ${page.note}
                        </p>
                    </div>
                </article>
            `;
        }

        // Обновление интерфейса альбома
        function renderAlbum() {
            const container = document.getElementById('album-container');
            const paginationControls = document.getElementById('pagination-controls');
            const progressWrapper = document.getElementById('progress-wrapper');

            if (isShowAllMode) {
                paginationControls.classList.add('hidden');
                progressWrapper.classList.add('hidden');
                container.className = 'w-full space-y-10 py-2';
                container.innerHTML = albumPages.map(page => renderCardHTML(page)).join('');
            } else {
                paginationControls.classList.remove('hidden');
                progressWrapper.classList.remove('hidden');
                container.className = 'w-full';

                const page = albumPages[currentPageIndex];
                container.innerHTML = renderCardHTML(page);

                // Обновление индикаторов прогресса
                const total = albumPages.length;
                document.getElementById('page-indicator').textContent = `Страница ${currentPageIndex + 1} из ${total}`;
                document.getElementById('chapter-badge').textContent = page.dateTag || "Финал 💌";
                document.getElementById('progress-bar').style.width = `${((currentPageIndex + 1) / total) * 100}%`;

                // Кнопки Назад / Дальше
                const prevBtn = document.getElementById('prev-btn');
                const nextBtn = document.getElementById('next-btn');
                const nextBtnText = document.getElementById('next-btn-text');
                const nextBtnIcon = document.getElementById('next-btn-icon');

                prevBtn.disabled = currentPageIndex === 0;

                if (currentPageIndex === total - 1) {
                    nextBtnText.textContent = 'В начало';
                    nextBtnIcon.className = 'fa-solid fa-rotate-left';
                } else if (currentPageIndex === total - 2) {
                    nextBtnText.textContent = 'Открытка 💌';
                    nextBtnIcon.className = 'fa-solid fa-heart';
                } else {
                    nextBtnText.textContent = 'Дальше';
                    nextBtnIcon.className = 'fa-solid fa-arrow-right';
                }

                // Точки навигации
                const dotsContainer = document.getElementById('dots-container');
                dotsContainer.innerHTML = albumPages.map((_, idx) => {
                    const active = idx === currentPageIndex;
                    return `
                        <button onclick="goToPage(${idx})" aria-label="Страница ${idx + 1}" class="h-2.5 rounded-full transition-all cursor-pointer ${active ? 'w-7 bg-rose-500' : 'w-2.5 bg-rose-200 hover:bg-rose-300'}"></button>
                    `;
                }).join('');
            }
        }

        function nextPage() {
            if (currentPageIndex < albumPages.length - 1) {
                currentPageIndex++;
            } else {
                currentPageIndex = 0;
            }
            renderAlbum();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function prevPage() {
            if (currentPageIndex > 0) {
                currentPageIndex--;
                renderAlbum();
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }
        }

        function goToPage(index) {
            currentPageIndex = index;
            renderAlbum();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function toggleViewMode() {
            isShowAllMode = !isShowAllMode;
            const btnText = document.getElementById('mode-btn-text');
            btnText.textContent = isShowAllMode ? 'Листать по страницам' : 'Показать все сразу';
            renderAlbum();
        }

        // Поддержка стрелок клавиатуры для удобного перелистывания
        document.addEventListener('keydown', (e) => {
            if (isShowAllMode) return;
            if (e.key === 'ArrowRight') nextPage();
            if (e.key === 'ArrowLeft') prevPage();
        });

        // Инициализация при загрузке
        window.onload = function() {
            initFloatingHearts();
            renderAlbum();
        };
    </script>
</body>
</html>
